<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Écrit - Bac de Français</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="ecrit" class="font-sans min-h-screen flex flex-col">
    
    <header class="editorial-header p-5 md:p-8 flex flex-col md:flex-row items-center justify-between gap-4">
        <a href="index.html" class="font-bold flex items-center nav-link self-start md:self-auto">&larr; Accueil</a>
        <h1 class="text-2xl md:text-3xl font-serif italic text-center">Préparation à l'Écrit</h1>
        <div class="hidden md:block w-20"></div>
    </header>

    <main class="flex-grow p-6 md:p-12 fade-in flex items-center justify-center">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 w-full max-w-5xl">
            
            <a href="dissertation.html" class="theme-card p-10 md:p-14 rounded-2xl flex flex-col items-center justify-center text-center group">
                <h2 class="text-3xl md:text-4xl font-serif mb-4">La Dissertation</h2>
                <div class="w-12 h-1 theme-bg-soft mb-6 transition-all group-hover:w-24"></div>
                <p class="text-sm md:text-base leading-relaxed opacity-80 px-4">
                    Révisions approfondies des 4 objets d'étude et fiches détaillées des 12 œuvres au programme national.
                </p>
            </a>

            <a href="commentaire.html" class="theme-card p-10 md:p-14 rounded-2xl flex flex-col items-center justify-center text-center group">
                <h2 class="text-3xl md:text-4xl font-serif mb-4">Le Commentaire</h2>
                <div class="w-12 h-1 theme-bg-soft mb-6 transition-all group-hover:w-24"></div>
                <p class="text-sm md:text-base leading-relaxed opacity-80 px-4">
                    Encyclopédie des mouvements, biographies d'auteurs, œuvres clés pour les ouvertures et fiches de procédés littéraires.
                </p>
            </a>

        </div>
    </main>
</body>
</html>
