<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dissertation - Bac de Français</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <header class="bg-indigo-800 text-white p-4 md:p-6 shadow-md flex items-center justify-between shrink-0">
        <a href="ecrit.html" class="text-white hover:text-indigo-200 font-bold text-sm md:text-lg nav-link">&larr; Retour</a>
        <h1 class="text-lg md:text-2xl font-black uppercase tracking-widest text-center">Dissertation</h1>
        <div class="w-16 md:w-32"></div>
    </header>

    <div class="flex flex-col md:flex-row flex-grow overflow-hidden">
        
        <aside class="w-full md:w-1/3 md:max-w-sm bg-white border-b md:border-b-0 md:border-r border-gray-200 md:overflow-y-auto custom-scroll p-4 md:p-6 shadow-sm shrink-0" id="sidebar-dissert">
            <h2 class="font-black text-indigo-900 text-lg md:text-xl mb-4 border-b pb-2">1. Objets d'étude</h2>
            
            <div id="menu-genres" class="grid grid-cols-2 md:grid-cols-1 gap-2 mb-6">
                <button onclick="chargerGenre('poesie')" class="w-full text-left p-3 rounded-lg hover:bg-indigo-50 font-bold text-gray-700 transition border border-transparent hover:border-indigo-200 text-sm">1. La Poésie</button>
                <button onclick="chargerGenre('theatre')" class="w-full text-left p-3 rounded-lg hover:bg-indigo-50 font-bold text-gray-700 transition border border-transparent hover:border-indigo-200 text-sm">2. Le Théâtre</button>
                <button onclick="chargerGenre('roman')" class="w-full text-left p-3 rounded-lg hover:bg-indigo-50 font-bold text-gray-700 transition border border-transparent hover:border-indigo-200 text-sm">3. Le Roman</button>
                <button onclick="chargerGenre('idees')" class="w-full text-left p-3 rounded-lg hover:bg-indigo-50 font-bold text-gray-700 transition border border-transparent hover:border-indigo-200 text-sm">4. Litt. d'idées</button>
            </div>
            
            <h2 class="font-black text-indigo-900 text-lg md:text-xl mb-4 border-b pb-2" id="titre-oeuvres-dispo">2. Œuvres</h2>
            <div id="liste-oeuvres-sidebar" class="space-y-3">
                <p class="text-sm text-gray-500 italic">Sélectionne un objet d'étude ci-dessus.</p>
            </div>
        </aside>

        <main class="flex-grow bg-white overflow-y-auto custom-scroll relative p-4 md:p-8">
            <div id="ecran-vide" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 md:p-10">
                <span class="text-5xl md:text-6xl mb-4">📚</span>
                <h2 class="text-xl md:text-3xl font-black text-gray-300">Sélectionne une œuvre pour réviser</h2>
            </div>

            <div id="contenu-oeuvre" class="hidden fade-in max-w-5xl mx-auto">
                <div class="mb-6 md:mb-8 border-b-4 border-indigo-600 pb-4 md:pb-6">
                    <h2 id="titre-oeuvre" class="text-2xl md:text-4xl font-black text-indigo-900 italic mb-2 leading-tight">Titre</h2>
                    <p id="auteur-oeuvre" class="text-lg md:text-xl font-bold text-gray-600">Auteur</p>
                    <p id="parcours-oeuvre" class="text-xs md:text-sm text-indigo-800 bg-indigo-100 inline-block px-3 py-2 rounded-full mt-3 md:mt-4 font-semibold uppercase tracking-wide">Parcours</p>
                    <div id="zone-bouton-mvt"></div>
                </div>

                <div class="flex border-b border-gray-200 mb-6 md:mb-8 overflow-x-auto custom-scroll pb-1">
                    <button onclick="changeTabOeuvre('resume')" id="tab-oeuvre-resume" class="py-2 md:py-3 px-4 md:px-6 font-black text-gray-500 hover:text-indigo-600 border-b-4 border-transparent transition-all tab-active whitespace-nowrap text-sm">Analyse & Résumé</button>
                    <button onclick="changeTabOeuvre('citations')" id="tab-oeuvre-citations" class="py-2 md:py-3 px-4 md:px-6 font-black text-gray-500 hover:text-indigo-600 border-b-4 border-transparent transition-all whitespace-nowrap text-sm">Citations</button>
                    <button onclick="changeTabOeuvre('docs')" id="tab-oeuvre-docs" class="py-2 md:py-3 px-4 md:px-6 font-black text-gray-500 hover:text-indigo-600 border-b-4 border-transparent transition-all whitespace-nowrap text-sm">Documents</button>
                    <button onclick="changeTabOeuvre('plans')" id="tab-oeuvre-plans" class="py-2 md:py-3 px-4 md:px-6 font-black text-gray-500 hover:text-indigo-600 border-b-4 border-transparent transition-all whitespace-nowrap text-sm">Plans</button>
                </div>

                <div id="detail-dynamique" class="space-y-6 md:space-y-8 pb-10"></div>
            </div>
        </main>
    </div>

    <script src="data-dissert.js"></script>
    <script src="app-dissert.js"></script>
</body>
</html>
