<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commentaire - Bac de Français</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- En-tête mobile friendly -->
    <header class="bg-purple-800 text-white p-4 md:p-6 shadow-md flex flex-col md:flex-row items-center justify-between shrink-0 gap-4">
        <a href="ecrit.html" class="text-white hover:text-purple-200 font-bold text-sm md:text-lg nav-link self-start md:self-auto">&larr; Retour à l'écrit</a>
        <h1 class="text-xl md:text-2xl font-black uppercase tracking-widest text-center">Commentaire de texte</h1>
        <div class="hidden md:block w-32"></div>
    </header>

    <div class="bg-slate-50 border-b-2 border-slate-200 px-2 md:px-6 shrink-0 sticky top-0 z-10">
        <div class="flex overflow-x-auto custom-scroll w-full max-w-7xl mx-auto">
            <button onclick="changeTabComm('mouvements')" id="tab-mouvements" class="flex-1 py-3 md:py-4 px-4 md:px-6 font-black text-gray-500 text-xs md:text-base uppercase tracking-tighter transition-all tab-active whitespace-nowrap">Mouvements</button>
           <button onclick="changeTabComm('auteurs')" id="tab-auteurs" class="flex-1 py-3 md:py-4 px-4 md:px-6 font-black text-gray-500 text-xs md:text-base uppercase tracking-tighter transition-all whitespace-nowrap">Auteurs</button>
            <button onclick="changeTabComm('oeuvres')" id="tab-oeuvres" class="flex-1 py-3 md:py-4 px-4 md:px-6 font-black text-gray-500 text-xs md:text-base uppercase tracking-tighter transition-all whitespace-nowrap">Œuvres clés</button>
            <button onclick="changeTabComm('procedes')" id="tab-procedes" class="flex-1 py-3 md:py-4 px-4 md:px-6 font-black text-gray-500 text-xs md:text-base uppercase tracking-tighter transition-all whitespace-nowrap">Procédés</button>
        </div>
    </div>

    <div class="bg-white px-4 md:px-6 py-4 shrink-0 border-b border-gray-100">
        <div id="subtabs-container" class="flex gap-2 overflow-x-auto custom-scroll pb-2 max-w-7xl mx-auto">
            <!-- Injecté par JS -->
        </div>
    </div>

    <main class="flex-grow bg-slate-50 p-4 md:p-10">
        <div id="contenu-dynamique" class="max-w-7xl mx-auto">
            <!-- Injecté par JS -->
        </div>
    </main>

    <script src="data-commentaire.js"></script>
    <script src="app-commentaire.js"></script>
</body>
</html>
