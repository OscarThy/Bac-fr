<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commentaire - Bac de Français</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen flex flex-col">
    <header class="bg-purple-800 text-white p-6 shadow-md flex items-center justify-between shrink-0">
        <a href="ecrit.html" class="text-white hover:text-purple-200 font-bold text-lg nav-link">&larr; Retour à l'écrit</a>
        <h1 class="text-2xl font-black uppercase tracking-widest">Commentaire de texte</h1>
        <div class="w-32"></div>
    </header>

    <div class="bg-slate-50 border-b-2 border-slate-200 px-6 shrink-0 sticky top-0 z-10">
        <div class="flex overflow-x-auto custom-scroll w-full max-w-7xl mx-auto">
            <button onclick="changeTabComm('mouvements')" id="tab-mouvements" class="flex-1 py-4 px-6 font-black text-gray-500 text-sm md:text-base uppercase tracking-tighter transition-all tab-active">Mouvements</button>
            <button onclick="changeTabComm('auteurs')" id="tab-auteurs" class="flex-1 py-4 px-6 font-black text-gray-500 text-sm md:text-base uppercase tracking-tighter transition-all">17+ Auteurs</button>
            <button onclick="changeTabComm('oeuvres')" id="tab-oeuvres" class="flex-1 py-4 px-6 font-black text-gray-500 text-sm md:text-base uppercase tracking-tighter transition-all">Œuvres clés</button>
            <button onclick="changeTabComm('procedes')" id="tab-procedes" class="flex-1 py-4 px-6 font-black text-gray-500 text-sm md:text-base uppercase tracking-tighter transition-all">Procédés Littéraires</button>
        </div>
    </div>

    <div class="bg-white px-6 py-4 shrink-0 border-b border-gray-100">
        <div id="subtabs-container" class="flex gap-3 overflow-x-auto custom-scroll w-full max-w-7xl mx-auto pb-2"></div>
    </div>

    <main class="flex-grow p-6 md:p-10 w-full max-w-7xl mx-auto">
        <div id="contenu-dynamique" class="space-y-6 fade-in"></div>
    </main>

    <script src="data.js"></script>
    <script src="app-commentaire.js"></script>
</body>
</html>
